# BEMT Input File — UH-60 Black Hawk baseline
# Run with: python main.py --input examples/example_config.yaml

# ── Rotor geometry ────────────────────────────────────────────────────────────
rotor:
  radius_ft:    16.4
  n_blades:     3
  n_rotors:     1
  root_cutout:  0.19       # r/R — optional, defaults to first r_station
  rpm:          258        # RPM → tip_speed computed automatically
  # tip_speed_fps: 550.0  # alternative: specify tip speed directly
  tip_loss:     true       # Prandtl tip-loss correction (true/false)

# ── Atmosphere ────────────────────────────────────────────────────────────────
atmosphere:
  altitude_ft: 0.0
  T_today_F:   59.0        # ISA sea level standard day

# ── Blade geometry ────────────────────────────────────────────────────────────
blade:
  # Spanwise stations (r/R), chord (ft), and twist (deg) — all same length.
  # The solver interpolates these onto its internal integration grid,
  # so you can provide as few or as many stations as you need.
  r_stations: [0.19, 0.30, 0.45, 0.60, 0.75, 0.90, 1.00]
  chord_ft:   [1.08, 1.08, 1.08, 1.08, 1.08, 1.08, 1.08]
  twist_deg:  [0.0, -2.5, -5.0, -7.5, -10.0, -12.5, -14.0]

  # ── Airfoil assignment ────────────────────────────────────────────────────
  #
  # FORMAT A — airfoil_geometry (coordinate files → AGRC surrogate → C81):
  #   Provide one airfoil coordinate file per spanwise zone boundary.
  #   The AGRC neural network generates Cl/Cd/Cm tables automatically.
  #   Requires: pip install bemt-rotor[agrc]  +  agrc_dir set below.
  #
  # airfoil_geometry:
  #   - r: 0.19
  #     file: airfoils/root_profile.dat
  #   - r: 0.75
  #     file: airfoils/mid_profile.dat
  #   - r: 1.00
  #     file: airfoils/tip_profile.dat
  #
  # FORMAT B — airfoil_zones (named airfoils, resolved via the airfoils: block):
  #   Between zone boundaries the aerodynamic coefficients are linearly blended.
  #   All names must appear in the airfoils: section below.
  #
  airfoil_zones:
    - r:      0.19
      airfoil: SC1095_CFD
    - r:      0.75
      airfoil: SC1095_CFD
    - r:      1.00
      airfoil: SC1095_CFD   # swap to a tip airfoil here if desired

# ── Airfoil definitions (used with FORMAT B above) ────────────────────────────
# Each name maps to one of three sources:
#
#   source: builtin — bundled C81 table from bemt/data/ (name = filename stem)
#   source: c81     — load a C81 file from c81_dir/ or an explicit file: path
#   source: agrc    — generate C81 via AGRC surrogate (requires geometry: file)
#
airfoils:
  SC1095_CFD:
    source: builtin

  # Example: your own C81 table file
  # SC1094R8:
  #   source: c81
  #   file: my_tables/SC1094R8.dat   # explicit path (relative to this file)

  # Example: generate C81 from an airfoil coordinate file via AGRC
  # MyAirfoil:
  #   source: agrc
  #   geometry: airfoils/my_profile.dat

# ── Global paths (required only for the sources you use) ─────────────────────

# Directory containing *.dat C81 files (for source: c81, no explicit file:)
# c81_dir: ./my_c81_tables

# Path to the agrc_surrogate directory (for source: agrc or airfoil_geometry).
# Clone from: https://github.com/anandaero747/AGRC-Surrogate
# agrc_dir: ~/AGRC-Surrogate/agrc_surrogate

# ── Weight sweep ──────────────────────────────────────────────────────────────
sweep:
  weights_lb: [2200, 4000, 6000]

# ── Output file ───────────────────────────────────────────────────────────────
# Path for the detailed output file (sectional AoA, Ct, Cp, totals, FM).
# Relative paths are resolved from the directory containing this file.
output: results.out
